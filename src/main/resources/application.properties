spring.application.name=logstream
grpc.server.port=9090

# Lucene Index Storage
logstream.index-dir=./lucene-index

# Alerting Engine & Webhook Triggers
logstream.alerting.schedule-ms=15000

# Security Configurations
logstream.security.jwt.secret=dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JMb2dTdHJlYW0yMDI2IQ==
logstream.security.jwt.validity-ms=86400000
logstream.security.cors.allowed-origin=http://localhost:3000
logstream.grpc.api-keys=super-secret-ingestor-key-2026,cluster-daemon-key-42

# Suppress Lucene Vectorization warning on newer Java preview/early-access runtimes (Java 27)
logging.level.org.apache.lucene.internal.vectorization=ERROR

# Disable auto-generation of default security password in UserDetailsServiceAutoConfiguration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
