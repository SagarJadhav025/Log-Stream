spring.application.name=logstream
grpc.server.port=9090

# Lucene Index Storage & NRT SearcherManager (Day 2 Optimization)
logstream.index-dir=./lucene-index
logstream.lucene.ram-buffer-mb=256
logstream.lucene.refresh-interval-ms=1000
logstream.lucene.commit-interval-seconds=30
logstream.lucene.max-merged-segment-mb=512
logstream.lucene.segments-per-tier=10

# gRPC Ingestion Buffering & Async Batch Processing (Day 1 Optimization)
logstream.ingestion.buffer-capacity=100000
logstream.ingestion.batch-size=2000
logstream.ingestion.flush-interval-ms=50
logstream.ingestion.websocket-sample-rate=10

# Alerting Engine & Webhook Triggers
logstream.alerting.schedule-ms=15000

# Security Configurations
logstream.security.jwt.secret=dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JMb2dTdHJlYW0yMDI2IQ==
logstream.security.jwt.validity-ms=86400000
logstream.security.cors.allowed-origin=http://localhost:3000
logstream.grpc.api-keys=super-secret-ingestor-key-2026,cluster-daemon-key-42

# Day 3: Java 21 Virtual Threads (enabled globally for Spring Boot executors)
spring.threads.virtual.enabled=true

# Suppress Lucene Vectorization warning on newer Java preview/early-access runtimes
logging.level.org.apache.lucene.internal.vectorization=ERROR

# Disable auto-generation of default security password in UserDetailsServiceAutoConfiguration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
